{{- if .Values.managedPostgres.enabled }}
{{- $secretName := "til-postgres-credentials" -}}
{{- $existingSecret := lookup "v1" "Secret" $.Release.Namespace $secretName -}}
{{- $existingData := dict -}}
{{- if and $existingSecret $existingSecret.data -}}
{{- $existingData = $existingSecret.data -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $.Release.Namespace | quote }}
type: Opaque
data:
  password: {{ default (randAlphaNum 40 | b64enc) (index $existingData "password") }}
{{- end }}
