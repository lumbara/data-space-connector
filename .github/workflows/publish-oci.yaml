name: Publish OCI Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/workflows/publish-oci.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package and publish charts
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          for chart_file in charts/*/Chart.yaml; do
            chart_dir="$(dirname "$chart_file")"
            chart_name="$(basename "$chart_dir")"

            echo "Building dependencies for $chart_name"
            helm dependency build "$chart_dir"

            echo "Packaging $chart_name"
            package_output="$(helm package "$chart_dir" --destination /tmp)"
            package_file="$(echo "$package_output" | awk '{print $NF}' | tail -n 1)"

            echo "Pushing $package_file to ghcr.io/$OWNER"
            if ! push_output="$(helm push "$package_file" "oci://ghcr.io/$OWNER" 2>&1)"; then
              if echo "$push_output" | grep -qi "already exists"; then
                echo "Skipping $chart_name: version already exists in GHCR"
                continue
              fi
              echo "$push_output"
              exit 1
            fi
            echo "$push_output"
          done
